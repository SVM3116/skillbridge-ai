<html lang="en">
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkillBridge AI | Precision Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Berkeley+Mono&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #fbf9fa; }
  .mono { font-family: 'Berkeley Mono', monospace; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  @keyframes slow-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .animate-slow-spin { animation: slow-spin 8s linear infinite; }
  @keyframes bounce-custom { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .dot-bounce { animation: bounce-custom 1s infinite ease-in-out; }
  @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
  .animate-fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes dashMove { to { stroke-dashoffset: -20; } }
  .connector-animated { stroke-dasharray: 5, 5; animation: dashMove 1s linear infinite; }
  @keyframes glowActive { 0%, 100% { box-shadow: 0 0 15px 2px rgba(30, 64, 175, 0.3); } 50% { box-shadow: 0 0 25px 8px rgba(30, 64, 175, 0.5); } }
  .animate-glow-active { animation: glowActive 2s infinite ease-in-out; }
  .course-card-expandable { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); max-height: 200px; overflow: hidden; }
  .course-card-expandable:hover { max-height: 500px; }
  .bg-primary { background-color: #00288e; }
  .text-primary { color: #00288e; }
  .border-primary { border-color: #00288e; }
  ::-webkit-scrollbar { display: none; }
</style>
  </head>
